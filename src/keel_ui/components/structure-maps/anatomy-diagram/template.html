<div class="cp-html-block cp-html-block-anatomy">
  <figure class="cp-anatomy" aria-label="{% if title %}{{ title }}{% else %}Anatomy diagram{% endif %}">
    {% if title or subtitle %}
    <figcaption class="cp-anatomy__head">
      {% if title %}<span class="cp-anatomy__title">{{ title }}</span>{% endif %}
      {% if subtitle %}<span class="cp-anatomy__subtitle">{{ subtitle }}</span>{% endif %}
    </figcaption>
    {% endif %}

    <div class="cp-anatomy__stage">
      <div class="cp-anatomy__col cp-anatomy__col--left">
        {% for part in parts %}{% if part.position == "top-left" or part.position == "left" or part.position == "bottom-left" %}
        <div class="cp-anatomy__callout cp-anatomy__callout--{{ part.tone|default:'default' }} cp-anatomy__callout--{{ part.position }}">
          <span class="cp-anatomy__dot" aria-hidden="true"></span>
          <span class="cp-anatomy__label">{{ part.label }}</span>
          {% if part.description %}<span class="cp-anatomy__desc">{{ part.description }}</span>{% endif %}
        </div>
        {% endif %}{% endfor %}
      </div>

      <div class="cp-anatomy__subject">
        <div class="cp-anatomy__subject-art" role="img" aria-label="{{ subject_label|default:'Subject' }}">
          {% if subject == "custom" and subject_svg %}{{ subject_svg|safe }}{% else %}
          <svg class="cp-anatomy__svg" viewBox="0 0 200 240" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
            <line class="cp-anatomy__grid" x1="20" y1="40" x2="180" y2="40"/>
            <line class="cp-anatomy__grid" x1="20" y1="120" x2="180" y2="120"/>
            <line class="cp-anatomy__grid" x1="20" y1="200" x2="180" y2="200"/>
            <line class="cp-anatomy__wick" x1="100" y1="24" x2="100" y2="64"/>
            <line class="cp-anatomy__wick" x1="100" y1="176" x2="100" y2="216"/>
            <rect class="cp-anatomy__body" x="64" y="64" width="72" height="112" rx="5"/>
            <line class="cp-anatomy__edge" x1="64" y1="160" x2="136" y2="160"/>
            <line class="cp-anatomy__edge" x1="64" y1="80" x2="136" y2="80"/>
          </svg>
          {% endif %}
        </div>
        {% if subject_label %}<span class="cp-anatomy__subject-label">{{ subject_label }}</span>{% endif %}
      </div>

      <div class="cp-anatomy__col cp-anatomy__col--right">
        {% for part in parts %}{% if part.position == "top-right" or part.position == "right" or part.position == "bottom-right" %}
        <div class="cp-anatomy__callout cp-anatomy__callout--{{ part.tone|default:'default' }} cp-anatomy__callout--{{ part.position }}">
          <span class="cp-anatomy__dot" aria-hidden="true"></span>
          <span class="cp-anatomy__label">{{ part.label }}</span>
          {% if part.description %}<span class="cp-anatomy__desc">{{ part.description }}</span>{% endif %}
        </div>
        {% endif %}{% endfor %}
      </div>
    </div>
  </figure>
</div>
