<figure class="cp-figure cp-figure-chart-interactive">
    <div class="cp-chartjs-wrapper" style="position:relative;height:340px">
        <canvas id="{{ instance_id }}"
                data-cp-chart="{% cp_area_config title labels values 'danger' y_label|default:'Drawdown (%)' markers %}"></canvas>
    </div>
    {% if caption %}<figcaption>{{ caption }}</figcaption>{% endif %}
</figure>
