{% load static %}<!DOCTYPE html>
<html lang="en" data-keel-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block cl_title %}Component Library{% endblock %} | Keel UI</title>
    <meta name="description" content="Interactive catalog of the Keel UI (cp-*) visual content components.">
    <meta name="robots" content="noindex,nofollow">
    <meta name="color-scheme" content="light dark">
    <link rel="stylesheet" href="{% static 'keel_ui/css/content-pipeline.css' %}">
    <link rel="stylesheet" href="{% static 'component_library/css/showcase.css' %}">
    {% block extra_head %}{% endblock %}
</head>
<body class="page-component-library">
<div class="cl-shell">
    {% include "component_library/_sidebar.html" %}
    <main class="cl-main">
        {% block cl_main %}{% endblock %}
    </main>
</div>
<script src="{% static 'keel_ui/js/content-pipeline.js' %}" defer></script>
<script src="{% static 'component_library/js/showcase.js' %}" defer></script>
{% block extra_js %}{% endblock %}
</body>
</html>
