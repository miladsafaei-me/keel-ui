[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "keel-ui"
version = "0.1.5"
description = "Keel UI — a typed catalog of themeable content-visual components (cp-* library) plus a renderer, for Django content pipelines."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Milad Safaei", email = "miladsafaei.me@gmail.com" }]
dependencies = [
    "Django>=4.2",
    "jsonschema>=4.0",
]

[project.urls]
Homepage = "https://github.com/miladsafaei-me/keel-ui"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
keel_ui = [
    "components/*",
    "components/**/*",
    "static/**/*",
    "templates/**/*",
]
